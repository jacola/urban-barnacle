name: Daily ranking snapshot

on:
  schedule:
    # 06:23 UTC daily (off the hour to avoid GitHub's peak scheduler load).
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # ~1000 character-page lookups with a 1 s pause take ~20 minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and archive today's ranking and character stats
        run: python scripts/powerrank.py fetch

      - name: Rebuild history.json and players.json
        run: python scripts/powerrank.py build

      - name: Refresh the full character directory
        continue-on-error: true
        run: python scripts/powerrank.py directory

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Snapshot $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
